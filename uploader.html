<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SinisterNL — Photo Uploader</title>
  <style>
    :root {
      --ink: #07101c; --deep: #0d1e30; --layer: #162a40;
      --terra: #c8733a; --terra2: #e08d50; --teal: #17b8ac;
      --cream: #ede8de; --fog: #7d94ab; --gold: #d4a843;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: var(--ink); color: var(--cream);
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh; display: flex;
      align-items: center; justify-content: center; padding: 2rem;
    }
    .card {
      background: var(--deep); border: 1px solid rgba(200,115,58,0.2);
      border-radius: 12px; padding: 2.5rem; width: 100%; max-width: 520px;
    }
    h1 { font-size: 1.3rem; color: var(--terra); margin-bottom: 0.3rem; letter-spacing: 0.02em; }
    .subtitle { font-size: 0.75rem; color: var(--fog); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 2rem; }

    label {
      display: block; font-size: 0.7rem; letter-spacing: 0.18em;
      text-transform: uppercase; color: var(--fog);
      margin-bottom: 0.4rem; margin-top: 1.2rem;
    }
    .label-row { display: flex; align-items: center; gap: 0.5rem; margin-top: 1.2rem; margin-bottom: 0.4rem; }
    .label-row label { margin: 0; }
    .ai-badge {
      font-size: 0.6rem; background: rgba(212,168,67,0.15); color: var(--gold);
      border: 1px solid rgba(212,168,67,0.35); border-radius: 3px;
      padding: 0.1rem 0.45rem; letter-spacing: 0.12em; text-transform: uppercase;
      font-weight: 600; opacity: 0; transition: opacity 0.3s;
    }
    .ai-badge.show { opacity: 1; }

    input, select {
      width: 100%; background: var(--layer); border: 1px solid rgba(200,115,58,0.15);
      border-radius: 6px; color: var(--cream); padding: 0.7rem 1rem;
      font-size: 0.88rem; outline: none; transition: border-color 0.2s;
    }
    input:focus, select:focus { border-color: var(--terra); }
    input[type="password"] { letter-spacing: 0.1em; }

    .drop-zone {
      margin-top: 1.2rem; border: 2px dashed rgba(200,115,58,0.25);
      border-radius: 8px; padding: 2.5rem 1rem; text-align: center;
      cursor: pointer; transition: border-color 0.2s, background 0.2s; position: relative;
    }
    .drop-zone:hover, .drop-zone.dragover { border-color: var(--terra); background: rgba(200,115,58,0.05); }
    .drop-zone input[type="file"] {
      position: absolute; inset: 0; opacity: 0; cursor: pointer;
      width: 100%; height: 100%; padding: 0; border: none; background: none;
    }
    .drop-icon { font-size: 2rem; margin-bottom: 0.5rem; }
    .drop-text { font-size: 0.8rem; color: var(--fog); }
    .drop-name { font-size: 0.9rem; color: var(--terra2); margin-top: 0.5rem; font-weight: 600; }

    .preview-img {
      display: none; width: 100%; max-height: 200px;
      object-fit: cover; border-radius: 6px; margin-top: 1rem;
    }

    .ai-status {
      display: none; margin-top: 0.8rem; padding: 0.7rem 1rem;
      background: rgba(212,168,67,0.08); border: 1px solid rgba(212,168,67,0.25);
      border-radius: 6px; font-size: 0.8rem; color: var(--gold);
      display: none; align-items: center; gap: 0.6rem;
    }
    .ai-status.show { display: flex; }
    .spinner {
      width: 14px; height: 14px; border: 2px solid rgba(212,168,67,0.3);
      border-top-color: var(--gold); border-radius: 50%;
      animation: spin 0.7s linear infinite; flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .btn {
      width: 100%; margin-top: 1.8rem; padding: 0.9rem;
      background: var(--terra); color: var(--ink); border: none; border-radius: 6px;
      font-size: 0.88rem; font-weight: 700; letter-spacing: 0.1em;
      text-transform: uppercase; cursor: pointer; transition: background 0.2s;
    }
    .btn:hover:not(:disabled) { background: var(--terra2); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .status {
      margin-top: 1.2rem; padding: 0.8rem 1rem; border-radius: 6px;
      font-size: 0.82rem; display: none;
    }
    .status.info  { background: rgba(23,184,172,0.1);  border: 1px solid rgba(23,184,172,0.3);  color: var(--teal);   display: block; }
    .status.ok    { background: rgba(50,200,100,0.1);  border: 1px solid rgba(50,200,100,0.3);  color: #5dde8a;       display: block; }
    .status.error { background: rgba(220,60,60,0.1);   border: 1px solid rgba(220,60,60,0.3);   color: #f08080;       display: block; }

    .step { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.3rem; }
    .token-hint { font-size: 0.72rem; color: var(--fog); margin-top: 0.4rem; }
    .token-hint a { color: var(--terra2); }
  </style>
</head>
<body>
<div class="card">
  <h1>📸 Photo Uploader</h1>
  <p class="subtitle">SinisterNL · AI-powered</p>

  <label>GitHub Token</label>
  <input type="password" id="token" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" />
  <p class="token-hint">
    Need one? <a href="https://github.com/settings/tokens/new?scopes=repo&description=SinisterNL+Uploader" target="_blank">Create token</a> — select <strong>repo</strong> scope.
  </p>

  <label>Photo</label>
  <div class="drop-zone" id="dropZone">
    <input type="file" id="fileInput" accept="image/*" />
    <div class="drop-icon">🖼️</div>
    <div class="drop-text">Drop image here or click to browse</div>
    <div class="drop-name" id="dropName"></div>
  </div>
  <img class="preview-img" id="preview" />

  <div class="ai-status" id="aiStatus">
    <div class="spinner"></div>
    <span id="aiStatusText">Analyzing photo with AI…</span>
  </div>

  <div class="label-row">
    <label for="section">Section</label>
    <span class="ai-badge" id="sectionBadge">AI ✨</span>
  </div>
  <select id="section">
    <option value="curacao">Curaçao</option>
    <option value="miniatures">Miniatures</option>
  </select>

  <div class="label-row">
    <label for="caption">Caption</label>
    <span class="ai-badge" id="captionBadge">AI ✨</span>
  </div>
  <input type="text" id="caption" placeholder="AI will suggest one after you drop a photo" />

  <label>Filename on site</label>
  <input type="text" id="filename" placeholder="e.g. beach2.jpg" />

  <button class="btn" id="uploadBtn" onclick="upload()">Upload &amp; Publish</button>
  <div class="status" id="status"></div>
</div>

<script>
  const OWNER = 'SinisterNL';
  const REPO  = 'SinisterNL.github.io';
  const BRANCH = 'main';

  // Restore saved token
  const tokenInput = document.getElementById('token');
  const saved = localStorage.getItem('sinisternl_gh_token');
  if (saved) tokenInput.value = saved;
  tokenInput.addEventListener('change', () =>
    localStorage.setItem('sinisternl_gh_token', tokenInput.value.trim())
  );

  let fileData = null;
  let fileMediaType = 'image/jpeg';

  const fileInput = document.getElementById('fileInput');
  const dropZone  = document.getElementById('dropZone');
  const preview   = document.getElementById('preview');
  const dropName  = document.getElementById('dropName');

  fileInput.addEventListener('change', e => handleFile(e.target.files[0]));
  dropZone.addEventListener('dragover',  e => { e.preventDefault(); dropZone.classList.add('dragover'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    handleFile(e.dataTransfer.files[0]);
  });

  function handleFile(file) {
    if (!file) return;
    fileMediaType = file.type || 'image/jpeg';
    dropName.textContent = file.name;
    if (!document.getElementById('filename').value)
      document.getElementById('filename').value = file.name;

    const reader = new FileReader();
    reader.onload = e => {
      fileData = e.target.result.split(',')[1];
      preview.src = e.target.result;
      preview.style.display = 'block';
      analyzeWithAI();
    };
    reader.readAsDataURL(file);
  }

  async function analyzeWithAI() {
    const aiStatus     = document.getElementById('aiStatus');
    const aiStatusText = document.getElementById('aiStatusText');
    const sectionBadge = document.getElementById('sectionBadge');
    const captionBadge = document.getElementById('captionBadge');

    aiStatus.classList.add('show');
    aiStatusText.textContent = 'Analyzing photo with AI…';
    sectionBadge.classList.remove('show');
    captionBadge.classList.remove('show');

    try {
      const res = await fetch('/api/analyze-photo', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ imageData: fileData, mediaType: fileMediaType })
      });
      const result = await res.json();

      if (result.error) throw new Error(result.error);

      if (result.section) {
        document.getElementById('section').value = result.section;
        sectionBadge.classList.add('show');
      }
      if (result.caption) {
        document.getElementById('caption').value = result.caption;
        captionBadge.classList.add('show');
      }

      aiStatusText.textContent = '✓ AI categorized — review and adjust if needed';
      setTimeout(() => aiStatus.classList.remove('show'), 3000);

    } catch (err) {
      aiStatusText.textContent = '⚠ AI unavailable — fill in manually';
      setTimeout(() => aiStatus.classList.remove('show'), 3000);
    }
  }

  function setStatus(msg, type) {
    const el = document.getElementById('status');
    el.innerHTML = msg;
    el.className = 'status ' + type;
  }

  async function githubRequest(path, method, body) {
    const token = document.getElementById('token').value.trim();
    const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}`, {
      method,
      headers: {
        'Authorization': `Bearer ${token}`,
        'Content-Type': 'application/json',
        'Accept': 'application/vnd.github+json'
      },
      body: body ? JSON.stringify(body) : undefined
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.message || res.statusText);
    return data;
  }

  async function upload() {
    const token    = document.getElementById('token').value.trim();
    const section  = document.getElementById('section').value;
    const filename = document.getElementById('filename').value.trim();
    const caption  = document.getElementById('caption').value.trim();

    if (!token)    return setStatus('⚠️ Enter your GitHub token first.', 'error');
    if (!fileData) return setStatus('⚠️ Select an image first.', 'error');
    if (!filename) return setStatus('⚠️ Enter a filename.', 'error');
    if (!caption)  return setStatus('⚠️ Enter a caption.', 'error');

    document.getElementById('uploadBtn').disabled = true;

    try {
      setStatus('<div class="step"><span>⬆️</span> Uploading image…</div>', 'info');

      let imageSha;
      try { imageSha = (await githubRequest(`images/${filename}`, 'GET')).sha; } catch {}

      await githubRequest(`images/${filename}`, 'PUT', {
        message: `Add image: ${filename}`,
        content: fileData,
        branch: BRANCH,
        ...(imageSha ? { sha: imageSha } : {})
      });

      setStatus('<div class="step"><span>✅</span> Image uploaded</div><div class="step"><span>📄</span> Updating index.html…</div>', 'info');

      const indexData = await githubRequest('index.html', 'GET');
      let html = atob(indexData.content.replace(/\n/g, ''));
      const sha = indexData.sha;

      const marker = section === 'miniatures' ? 'END_MINIATURES' : 'END_CURACAO';
      if (!html.includes(`// ${marker}`)) throw new Error(`Marker ${marker} not found in index.html`);

      const newEntry = `      { src: "images/${filename}", caption: "${caption}" },\n    `;
      html = html.replace(`    ]; // ${marker}`, `    ${newEntry}]; // ${marker}`);

      await githubRequest('index.html', 'PUT', {
        message: `Add ${filename} to ${section}`,
        content: btoa(unescape(encodeURIComponent(html))),
        sha, branch: BRANCH
      });

      setStatus(
        `<div class="step"><span>✅</span> Image uploaded</div>` +
        `<div class="step"><span>✅</span> index.html updated</div>` +
        `<div class="step"><span>🚀</span> Deploying to sinisternl.net — live in ~60s</div>`,
        'ok'
      );

      document.getElementById('filename').value = '';
      document.getElementById('caption').value  = '';
      fileData = null;
      preview.style.display = 'none';
      dropName.textContent = '';
      document.getElementById('sectionBadge').classList.remove('show');
      document.getElementById('captionBadge').classList.remove('show');

    } catch(err) {
      setStatus(`❌ ${err.message}`, 'error');
    }

    document.getElementById('uploadBtn').disabled = false;
  }
</script>
</body>
</html>
